<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>多人舒壓房</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;

    font-family:
    "Noto Sans TC",
    sans-serif;

    background:
    linear-gradient(
      180deg,
      #87ceeb 0%,
      #cfefff 60%,
      #b6e388 100%
    );
}

#room{
    position:relative;
    width:100vw;
    height:100vh;

    overflow:hidden;
}

.player{
    position:absolute;

    width:60px;
    height:60px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    transform:
    translate(-50%,-50%);

    transition:
    .1s linear;

    box-shadow:
    0 5px 15px
    rgba(0,0,0,.15);
}

.me{
    background:
    linear-gradient(
      135deg,
      #ff9ecf,
      #ff7eb3
    );

    border:
    4px solid white;
}

.other{
    background:
    linear-gradient(
      135deg,
      #6cc6ff,
      #4aa3ff
    );

    border:
    4px solid white;
}

.name{
    position:absolute;

    top:-28px;

    left:50%;

    transform:
    translateX(-50%);

    color:#2f3d55;

    font-weight:bold;

    background:
    rgba(255,255,255,.8);

    padding:
    2px 10px;

    border-radius:20px;

    white-space:nowrap;
}

#info{
    position:fixed;
    top:20px;
    left:20px;

    background:
    rgba(255,255,255,.65);

    backdrop-filter:
    blur(12px);

    padding:16px;

    border-radius:20px;

    color:#3b4a66;

    font-size:14px;

    box-shadow:
    0 8px 30px
    rgba(0,0,0,.1);

    z-index:999;
}
    .cloud{
    position:absolute;

    background:white;

    border-radius:100px;

    opacity:.7;

    filter:blur(1px);
}

.c1{
    width:180px;
    height:60px;

    top:60px;

    animation:
    floatCloud 35s linear infinite;
}

.c2{
    width:140px;
    height:50px;

    top:180px;

    animation:
    floatCloud 45s linear infinite;
}

.c3{
    width:220px;
    height:70px;

    top:120px;

    animation:
    floatCloud 60s linear infinite;
}

@keyframes floatCloud{

    from{
        left:-300px;
    }

    to{
        left:110%;
    }

}
.flower{
    animation:
    flowerPop .3s ease;
}

@keyframes flowerPop{

    from{
        transform:
        translate(-50%,-50%)
        scale(0);
    }

    to{
        transform:
        translate(-50%,-50%)
        scale(1);
    }

}
</style>
</head>
<body>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<div id="info">
<div>WASD移動</div>
<div>1😀 2❤️ 3😭 4😡</div>
<div>F 種花</div>
<div id="onlineCount">
在線人數：0
</div>
</div>

<div id="room"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
 getDatabase,
 ref,
 set,
 onValue,
 onDisconnect,
 push
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnBtUMlvnbkor6cp1zigX2jEuDzZaSFBU",
  authDomain: "onlinerelax.firebaseapp.com",
  databaseURL: "https://onlinerelax-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onlinerelax",
  storageBucket: "onlinerelax.firebasestorage.app",
  messagingSenderId: "234054299146",
  appId: "1:234054299146:web:678ddda9af9cf5aa4bb9f3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const flowerLayer =
document.createElement("div");

flowerLayer.style.position="absolute";
flowerLayer.style.width="100%";
flowerLayer.style.height="100%";

room.appendChild(flowerLayer);

const playerId =
"player_" +
Math.random().toString(36).slice(2,10);

const playerName =
"玩家" +
Math.floor(Math.random()*1000);

let myPlayer = {
    x: window.innerWidth/2,
    y: window.innerHeight/2
};

const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

set(
    ref(db,"players/"+playerId),
    {
        name:playerName,
        x:myPlayer.x,
        y:myPlayer.y
    }
);

onDisconnect(
 ref(db,"players/"+playerId)
).remove();

const playerElements = {};

function renderPlayers(players){

    for(const id in playerElements){

        if(!players[id]){

            playerElements[id].remove();

            delete playerElements[id];
        }
    }

    for(const id in players){

        const p = players[id];

        if(!playerElements[id]){

            const el =
            document.createElement("div");

            el.className =
            "player " +
            (id===playerId ? "me":"other");

            const name =
            document.createElement("div");

            name.className="name";

            name.textContent=p.name;

            el.appendChild(name);

            room.appendChild(el);

            playerElements[id]=el;
        }

        playerElements[id].style.left =
        p.x+"px";

        playerElements[id].style.top =
        p.y+"px";

        playerElements[id].innerHTML =
        `<div class="name">${p.name}</div>`;
    }
}

onValue(
 ref(db,"players"),
 snapshot=>{

    const players =
    snapshot.val() || {};
    
    document.getElementById(
     "onlineCount"
    ).textContent =
    "在線人數：" +
    Object.keys(players).length;
    
    renderPlayers(players);

 }
);
onValue(
 ref(db,"flowers"),
 snapshot=>{

   flowerLayer.innerHTML="";

   const flowers =
   snapshot.val() || {};

   for(const id in flowers){

      const flower =
      document.createElement("div");

      flower.textContent="🌸";

      flower.style.position="absolute";

      flower.style.left =
      flowers[id].x+"px";

      flower.style.top =
      flowers[id].y+"px";

      flower.style.transform=
      "translate(-50%,-50%)";

      flower.style.fontSize="24px";

      flowerLayer.appendChild(
        flower
      );
   }

 }
);
onValue(
 ref(db,"emotes"),
 snapshot=>{

   document
   .querySelectorAll(".emoji")
   .forEach(e=>e.remove());

   const emotes =
   snapshot.val() || {};

   const now =
   Date.now();

   for(const id in emotes){

      const data =
      emotes[id];

      if(
        now-data.time
        >3000
      ) continue;

      const emoji =
      document.createElement("div");

      emoji.className="emoji";

      emoji.textContent=
      data.emoji;

      emoji.style.position=
      "absolute";

      emoji.style.left=
      data.x+"px";

      emoji.style.top=
      (data.y-50)+"px";

      emoji.style.fontSize=
      "32px";

      room.appendChild(
        emoji
      );
   }

 }
);
function gameLoop(){

    const speed = 4;

    if(keys["w"]) myPlayer.y -= speed;
    if(keys["s"]) myPlayer.y += speed;
    if(keys["a"]) myPlayer.x -= speed;
    if(keys["d"]) myPlayer.x += speed;

    myPlayer.x =
    Math.max(
        25,
        Math.min(
            window.innerWidth-25,
            myPlayer.x
        )
    );

    myPlayer.y =
    Math.max(
        25,
        Math.min(
            window.innerHeight-25,
            myPlayer.y
        )
    );

    set(
      ref(db,"players/"+playerId),
      {
          name:playerName,
          x:myPlayer.x,
          y:myPlayer.y
      }
    );

    requestAnimationFrame(
      gameLoop
    );
}
document.addEventListener(
 "keydown",
 e=>{

   if(e.key.toLowerCase()==="f"){

      push(
        ref(db,"flowers"),
        {
          x:myPlayer.x,
          y:myPlayer.y
        }
      );

   }

 }
);
document.addEventListener(
 "keydown",
 e=>{

   const map = {
      "1":"😀",
      "2":"❤️",
      "3":"😭",
      "4":"😡"
   };

   if(map[e.key]){

      push(
       ref(db,"emotes"),
       {
          emoji:map[e.key],
          x:myPlayer.x,
          y:myPlayer.y,
          time:Date.now()
       }
      );

   }

 }
);

gameLoop();

</script>

</body>
</html>
