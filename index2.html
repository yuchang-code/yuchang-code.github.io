<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>多人舒壓房</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#f5f7fa;
    font-family:Arial,sans-serif;
}

#room{
    position:relative;
    width:100vw;
    height:100vh;

    background:
    linear-gradient(#ffffff,#eef4ff);
}

.player{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:12px;
    font-weight:bold;
    transform:translate(-50%,-50%);
}

.me{
    background:#4caf50;
}

.other{
    background:#2196f3;
}

.name{
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    color:black;
    white-space:nowrap;
}

#info{
    position:fixed;
    top:10px;
    left:10px;
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
</style>
</head>
<body>

<div id="info">
<div>WASD移動</div>
<div>1😀 2❤️ 3😭 4😡</div>
<div>F 種花</div>
<div id="onlineCount">
在線人數：0
</div>
</div>

<div id="room"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
 getDatabase,
 ref,
 set,
 onValue,
 onDisconnect,
 push
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnBtUMlvnbkor6cp1zigX2jEuDzZaSFBU",
  authDomain: "onlinerelax.firebaseapp.com",
  databaseURL: "https://onlinerelax-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onlinerelax",
  storageBucket: "onlinerelax.firebasestorage.app",
  messagingSenderId: "234054299146",
  appId: "1:234054299146:web:678ddda9af9cf5aa4bb9f3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const flowerLayer =
document.createElement("div");

flowerLayer.style.position="absolute";
flowerLayer.style.width="100%";
flowerLayer.style.height="100%";

room.appendChild(flowerLayer);

const playerId =
"player_" +
Math.random().toString(36).slice(2,10);

const playerName =
"玩家" +
Math.floor(Math.random()*1000);

let myPlayer = {
    x: window.innerWidth/2,
    y: window.innerHeight/2
};

const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

set(
    ref(db,"players/"+playerId),
    {
        name:playerName,
        x:myPlayer.x,
        y:myPlayer.y
    }
);

onDisconnect(
 ref(db,"players/"+playerId)
).remove();

const playerElements = {};

function renderPlayers(players){

    for(const id in playerElements){

        if(!players[id]){

            playerElements[id].remove();

            delete playerElements[id];
        }
    }

    for(const id in players){

        const p = players[id];

        if(!playerElements[id]){

            const el =
            document.createElement("div");

            el.className =
            "player " +
            (id===playerId ? "me":"other");

            const name =
            document.createElement("div");

            name.className="name";

            name.textContent=p.name;

            el.appendChild(name);

            room.appendChild(el);

            playerElements[id]=el;
        }

        playerElements[id].style.left =
        p.x+"px";

        playerElements[id].style.top =
        p.y+"px";

        playerElements[id].innerHTML =
        `<div class="name">${p.name}</div>`;
    }
}

onValue(
 ref(db,"players"),
 snapshot=>{

    const players =
    snapshot.val() || {};
    
    document.getElementById(
     "onlineCount"
    ).textContent =
    "在線人數：" +
    Object.keys(players).length;
    
    renderPlayers(players);

 }
);
onValue(
 ref(db,"flowers"),
 snapshot=>{

   flowerLayer.innerHTML="";

   const flowers =
   snapshot.val() || {};

   for(const id in flowers){

      const flower =
      document.createElement("div");

      flower.textContent="🌸";

      flower.style.position="absolute";

      flower.style.left =
      flowers[id].x+"px";

      flower.style.top =
      flowers[id].y+"px";

      flower.style.transform=
      "translate(-50%,-50%)";

      flower.style.fontSize="24px";

      flowerLayer.appendChild(
        flower
      );
   }

 }
);
onValue(
 ref(db,"emotes"),
 snapshot=>{

   document
   .querySelectorAll(".emoji")
   .forEach(e=>e.remove());

   const emotes =
   snapshot.val() || {};

   const now =
   Date.now();

   for(const id in emotes){

      const data =
      emotes[id];

      if(
        now-data.time
        >3000
      ) continue;

      const emoji =
      document.createElement("div");

      emoji.className="emoji";

      emoji.textContent=
      data.emoji;

      emoji.style.position=
      "absolute";

      emoji.style.left=
      data.x+"px";

      emoji.style.top=
      (data.y-50)+"px";

      emoji.style.fontSize=
      "32px";

      room.appendChild(
        emoji
      );
   }

 }
);
function gameLoop(){

    const speed = 4;

    if(keys["w"]) myPlayer.y -= speed;
    if(keys["s"]) myPlayer.y += speed;
    if(keys["a"]) myPlayer.x -= speed;
    if(keys["d"]) myPlayer.x += speed;

    myPlayer.x =
    Math.max(
        25,
        Math.min(
            window.innerWidth-25,
            myPlayer.x
        )
    );

    myPlayer.y =
    Math.max(
        25,
        Math.min(
            window.innerHeight-25,
            myPlayer.y
        )
    );

    set(
      ref(db,"players/"+playerId),
      {
          name:playerName,
          x:myPlayer.x,
          y:myPlayer.y
      }
    );

    requestAnimationFrame(
      gameLoop
    );
}
document.addEventListener(
 "keydown",
 e=>{

   if(e.key.toLowerCase()==="f"){

      push(
        ref(db,"flowers"),
        {
          x:myPlayer.x,
          y:myPlayer.y
        }
      );

   }

 }
);
document.addEventListener(
 "keydown",
 e=>{

   const map = {
      "1":"😀",
      "2":"❤️",
      "3":"😭",
      "4":"😡"
   };

   if(map[e.key]){

      push(
       ref(db,"emotes"),
       {
          emoji:map[e.key],
          x:myPlayer.x,
          y:myPlayer.y,
          time:Date.now()
       }
      );

   }

 }
);
gameLoop();

</script>

</body>
</html>
