<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Relax 測試</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    margin-top:50px;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}

#output{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>Firebase Realtime Database 測試</h1>

<button id="saveBtn">
寫入資料
</button>

<div id="output">
等待資料...
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAnBtUMlvnbkor6cp1zigX2jEuDzZaSFBU",
  authDomain: "onlinerelax.firebaseapp.com",
  databaseURL: "https://onlinerelax-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onlinerelax",
  storageBucket: "onlinerelax.firebasestorage.app",
  messagingSenderId: "234054299146",
  appId: "1:234054299146:web:678ddda9af9cf5aa4bb9f3",
  measurementId: "G-HY9G3R5EVQ"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const output =
document.getElementById("output");

document
.getElementById("saveBtn")
.addEventListener("click",()=>{

    set(
      ref(db,"test"),
      {
        message:"Hello Relax Room",
        time:new Date().toLocaleString()
      }
    );

});

onValue(
  ref(db,"test"),
  (snapshot)=>{

      const data = snapshot.val();

      if(data){

          output.innerHTML = `
              <p>${data.message}</p>
              <p>${data.time}</p>
          `;

          console.log(data);
      }

  }
);

</script>

</body>
</html>
