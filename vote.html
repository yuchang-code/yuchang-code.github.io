<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人氣獎牌票選展覽館</title>
    <style>
        :root { 
            --primary-bg: #f8fafc; 
            --main-dark: #0f172a; 
            --accent-gold: #eab308; 
            --accent-hover: #ca8a04;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
        }
        body { 
            margin: 0; font-family: "Microsoft JhengHei", sans-serif; 
            background-color: var(--primary-bg); color: var(--text-dark);
            min-height: 100vh;
        }
        .page { display: none; }
        .page.active { display: block; }

        /* 載入動畫 */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; font-size: 24px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3); width: 50px; height: 50px;
            border-radius: 50%; border-left-color: var(--accent-gold);
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 頂部狀態列修改 (置中、左右分流) */
        .vote-status-bar {
            background: var(--accent-gold); color: var(--main-dark); text-align: center; padding: 10px;
            font-size: 14px; font-weight: bold; position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 5px;
        }
        .register-trigger-btn {
            background: var(--main-dark); color: white; border: none; padding: 4px 12px; 
            border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s;
        }

        /* 導覽列 */
        header { 
            background: var(--main-dark); height: 140px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 32px; font-weight: bold; letter-spacing: 3px;
        }
        .header-bar {
            background: var(--main-dark); color: white; padding: 15px; 
            display: flex; align-items: center; justify-content: center; position: relative; min-height: 40px;
        }
        .header-title { font-size: 24px; font-weight: bold; margin: 0; text-align: center; width: 100%; }
        .nav-btn {
            position: absolute; left: 20px; background-color: transparent; color: white;
            border: 2px solid white; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        /* 1. 首頁四大主題大鈕 */
        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 40px; max-width: 1000px; margin: 0 auto; }
        .theme-btn {
            background-color: var(--card-bg); color: var(--main-dark); height: 120px; 
            display: flex; align-items: center; justify-content: center; border: 2px solid #e2e8f0;
            font-size: 24px; border-radius: 16px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .theme-btn:hover { border-color: var(--accent-gold); transform: translateY(-3px); }

        /* 2. 學生列表頁 */
        .list-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .item-card {
            background-color: var(--card-bg); border-radius: 16px; padding: 15px;
            text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid #e2e8f0;
        }
        .item-card:hover { border-color: var(--accent-gold); transform: translateY(-5px); }
        .img-placeholder { background: #f1f5f9; width: 100%; aspect-ratio: 1/1; border-radius: 12px; margin-bottom: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center;}
        .img-placeholder img { width: 100%; height: 100%; object-fit: contain; }
        .card-title { font-weight: bold; font-size: 20px; color: var(--main-dark); }

        /* 3. 單一作品詳細頁 (純獎牌大圖) */
        .detail-container { max-width: 550px; margin: 30px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 25px; }
        .medal-title { font-size: 32px; font-weight: bold; text-align: center; margin: 0; color: var(--main-dark); }
        .image-viewer-box {
            background: white; padding: 20px; border-radius: 20px; border: 1px solid #e2e8f0;
            display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }
        .image-viewer-box img { width: 100%; max-height: 500px; object-fit: contain; border-radius: 10px; }
        
        /* 投票按鈕 */
        .vote-btn {
            background-color: var(--accent-gold); color: var(--main-dark); border: none; padding: 20px; width: 100%;
            border-radius: 16px; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(234, 179, 8, 0.2);
        }
        .vote-btn:hover { background-color: var(--accent-hover); }
        .vote-btn:disabled { background-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; box-shadow: none; }

        /* 📝 簽到彈出視窗 (Modal) 樣式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px; box-sizing: border-box;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: white; padding: 30px; border-radius: 24px; max-width: 400px; width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); text-align: center;
            animation: modalIn 0.3s ease-out;
        }
        @keyframes modalIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-box h3 { margin: 0 0 10px 0; font-size: 24px; color: var(--main-dark); }
        .modal-box p { color: var(--text-light); margin: 0 0 20px 0; font-size: 14px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 16px; box-sizing: border-box;
        }
        .form-group input:focus { border-color: var(--accent-gold); outline: none; }
        .modal-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; }
        .btn-submit-reg { background: var(--main-dark); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-skip-reg { background: transparent; color: var(--text-light); border: 1px solid #cbd5e1; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; }

        @media (max-width: 768px) {
            header { height: 100px; font-size: 24px; }
            .home-grid { grid-template-columns: 1fr; padding: 20px; }
            .list-grid { grid-template-columns: repeat(2, 1fr); padding: 20px; gap: 15px;}
            .medal-title { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">正在讀取展區資料...</div>
    </div>

    <div class="vote-status-bar">
        <div>您目前的累計投票數：<span id="vote-count">0</span> 票</div>
        <button class="register-trigger-btn" id="reg-status-badge" onclick="openRegisterModal()">✍️ 填寫觀展簽到</button>
    </div>

    <div id="page-home" class="page active">
        <header>人氣獎牌票選展區</header>
        <div class="home-grid">
            <div class="theme-btn" onclick="switchToList('物件')">✨ 記憶載體：物件</div>
            <div class="theme-btn" onclick="switchToList('配件')">💎 夢想裝配：配件</div>
            <div class="theme-btn" onclick="switchToList('技能')">⚡ 能力之章：技能</div>
            <div class="theme-btn" onclick="switchToList('特質')">🔥 靈魂特徵：特質</div>
        </div>
    </div>

    <div id="page-list" class="page">
        <div class="header-bar">
            <button class="nav-btn" onclick="switchToHome()">🏠 回首頁</button>
            <div class="header-title" id="list-title">主題</div>
        </div>
        <div class="list-grid" id="list-container"></div>
    </div>

    <div id="page-detail" class="page">
        <div class="header-bar">
            <button class="nav-btn" onclick="backToPrevious()">⬅ 返回</button>
            <div class="header-title">作品投票</div>
        </div>
        
        <div class="detail-container">
            <div class="medal-title" id="medal-author">學生姓名</div>
            <div class="image-viewer-box">
                <img id="medal-img" src="" alt="獎牌照片">
            </div>
            <button class="vote-btn" id="action-vote-btn" onclick="submitVote()">
                🗳️ 投給這個作品！
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="register-modal">
        <div class="modal-box">
            <h3>歡迎蒞臨展覽！</h3>
            <p>歡迎留下您的資訊完成觀展簽到（本表單為選填）</p>
            
            <div class="form-group">
                <label for="reg-student-id">您的學號 (選填)</label>
                <input type="text" id="reg-student-id" placeholder="請輸入學號">
            </div>
            <div class="form-group">
                <label for="reg-name">您的姓名 (選填)</label>
                <input type="text" id="reg-name" placeholder="請輸入姓名">
            </div>
            
            <div class="modal-buttons">
                <button class="btn-submit-reg" onclick="submitRegistration()">確認送出</button>
                <button class="btn-skip-reg" onclick="closeRegisterModal(true)">暫不登記，直接觀展</button>
            </div>
        </div>
    </div>

    <script>
        // 🌟 請保持此處為您部署得到的 GAS 網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwH7GySCb1uYUdm2Z0vmfYeoaksSzA4W1gabfO-w6O0mXl_0EVEBkuCOXoVuF-W7vvO/exec"; 

        let exhibitionData = null; 
        let currentCategory = "";
        let currentStudent = "";  
        
        // 票數改用純數字累計計數器，移除 3 票限制
        let totalVotes = parseInt(localStorage.getItem('total_votes_count')) || 0;
        let votedArtworks = JSON.parse(localStorage.getItem('my_votes')) || [];

        async function initData() {
            updateVoteUI();
            checkRegisterStatus();
            
            const cachedData = localStorage.getItem('exhibitionData_v3');
            if (cachedData) {
                try {
                    exhibitionData = JSON.parse(cachedData);
                    if (exhibitionData && exhibitionData.images) {
                        document.getElementById('loader').style.display = 'none';
                        checkQRUrlParam();
                        triggerAutoPopup();
                        return;
                    }
                } catch (e) {}
            }
            await fetchFromGoogle();
        }

        async function fetchFromGoogle() {
            try {
                const response = await fetch(GAS_URL);
                exhibitionData = await response.json();
                localStorage.setItem('exhibitionData_v3', JSON.stringify(exhibitionData));
                document.getElementById('loader').style.display = 'none';
                checkQRUrlParam();
                triggerAutoPopup();
            } catch (e) {
                document.getElementById('loader-text').innerText = "載入失敗，請重整網頁！";
            }
        }

        // 📝 簽到模組功能
        function checkRegisterStatus() {
            const status = localStorage.getItem('visitor_registered');
            const badge = document.getElementById('reg-status-badge');
            if (status === 'success') {
                badge.innerText = "✅ 已完成簽到登記";
                badge.style.background = "#10b981"; 
                badge.disabled = true;
            }
        }

        function triggerAutoPopup() {
            // 如果瀏覽器從未決定過（沒填過也沒跳過過），進站時自動彈窗
            if (!localStorage.getItem('visitor_registered')) {
                openRegisterModal();
            }
        }

        function openRegisterModal() {
            document.getElementById('register-modal').classList.add('open');
        }

        function closeRegisterModal(isSkipped = false) {
            document.getElementById('register-modal').classList.remove('open');
            if (isSkipped) {
                localStorage.setItem('visitor_registered', 'skipped');
            }
        }

        function submitRegistration() {
            const studentId = document.getElementById('reg-student-id').value.trim();
            const visitorName = document.getElementById('reg-name').value.trim();
        
            if (!studentId && !visitorName) {
                if(!confirm("您未填寫任何資訊，確定要直接進入展區嗎？")) return;
                closeRegisterModal(true);
                return;
            }
        
            // 🔒【核心防禦】點擊瞬間立刻鎖死按鈕，更改文字，防止狂點重複送出戳記！
            const regBtn = document.querySelector('.btn-submit-reg');
            regBtn.disabled = true;
            regBtn.innerText = "⏳ 正在傳送登記資訊...";
        
            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "register", 
                    studentId: studentId,
                    visitorName: visitorName
                })
            }).then(() => {
                localStorage.setItem('visitor_registered', 'success');
                alert("登記成功！祝您觀展愉快！");
                closeRegisterModal();
                checkRegisterStatus();
            }).catch(e => {
                alert("網路錯誤，登記失敗，請稍後再試。");
                // 萬一網路真的斷線傳輸失敗，才釋放按鈕讓使用者可以重試
                regBtn.disabled = false;
                regBtn.innerText = "確認送出";
            });
        }

        // 導覽功能
        function switchToHome() { 
            window.history.replaceState({}, document.title, window.location.pathname);
            showPage('page-home'); 
        }

        function switchToList(category) {
            currentCategory = category;
            document.getElementById('list-title').innerText = "主題：" + category;
            const container = document.getElementById('list-container');
            
            if (!exhibitionData || !exhibitionData.images) return;
            const filteredImages = exhibitionData.images.filter(img => img.category === category);
            
            let cardHtml = "";
            filteredImages.forEach(item => {
                // 列表保留小綠勾標記，提示哪些作品在本次觀展曾獲得支持
                const votedBadge = votedArtworks.includes(item.name) ? `<div style="color:var(--accent-gold); font-weight:bold; margin-top:5px;">✅ 已支持過</div>` : '';
                cardHtml += `
                    <div class="item-card" onclick="switchToDetail('${item.name}', '${item.url}')">
                        <div class="img-placeholder"><img src="${item.url}" alt="${item.name}"></div>
                        <div class="card-title">${item.name}</div>
                        ${votedBadge}
                    </div>
                `;
            });
            container.innerHTML = cardHtml;
            showPage('page-list');
        }

        function switchToDetail(name, imgUrl) {
            currentStudent = name;
            document.getElementById('medal-author').innerText = name + " 的作品";
            document.getElementById('medal-img').src = imgUrl; 
            updateVoteUI();
            showPage('page-detail');
        }

        function backToPrevious() { 
            if(currentCategory === "") switchToHome(); 
            else switchToList(currentCategory); 
        }

        function checkQRUrlParam() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            if (targetId && exhibitionData && exhibitionData.images) {
                const targetImg = exhibitionData.images.find(img => img.name === targetId);
                if (targetImg) {
                    currentCategory = targetImg.category; 
                    switchToDetail(targetId, targetImg.url);
                }
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        // 🗳️ 更新投票介面 (解鎖無限投票)
        function updateVoteUI() {
            document.getElementById('vote-count').innerText = totalVotes;
            const voteBtn = document.getElementById('action-vote-btn');
            
            // 🔓 移除任何限制邏輯，按鈕永遠保持可點擊狀態
            voteBtn.innerText = "🗳️ 投給這個作品！";
            voteBtn.disabled = false;
        }

        // 送出選票
        function submitVote() {
            const voteBtn = document.getElementById('action-vote-btn');
            voteBtn.disabled = true;
            voteBtn.innerText = "⏳ 正在傳送神盛選票...";
        
            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    action: "vote",
                    id: currentStudent 
                })
            }).then(() => {
                // 累計總票數
                totalVotes++;
                localStorage.setItem('total_votes_count', totalVotes);
                
                // 記錄曾投過此作品
                if (!votedArtworks.includes(currentStudent)) {
                    votedArtworks.push(currentStudent);
                    localStorage.setItem('my_votes', JSON.stringify(votedArtworks));
                }
                
                alert("✦ 投票成功！感謝您的專業評選 ✦");
                updateVoteUI(); // 重新初始化，按鈕恢復可用，允許繼續無限點擊投票！
            }).catch(e => {
                alert("網路傳輸異常，請稍後再試");
                updateVoteUI(); 
            });
        }

        initData();
    </script>
</body>
</html>
