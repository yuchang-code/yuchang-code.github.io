<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人氣票選展覽館</title>
    <style>
        :root { 
            /* 🌟 全新風格：沉穩藝廊風 (深藍、暖金、米白) */
            --primary-bg: #f4f4f5; 
            --main-dark: #1e293b; /* 深藍灰 */
            --accent-gold: #f59e0b; /* 暖金色 (主要動作) */
            --accent-hover: #d97706;
            --card-bg: #ffffff;
            --text-dark: #334155;
            --text-light: #94a3b8;
        }
        body { 
            margin: 0; font-family: "Microsoft JhengHei", sans-serif; 
            background-color: var(--primary-bg); color: var(--text-dark);
            min-height: 100vh;
        }

        .page { display: none; }
        .page.active { display: block; }

        /* ---------------- 載入動畫 ---------------- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 41, 59, 0.95); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; font-size: 24px; transition: opacity 0.5s;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3); width: 50px; height: 50px;
            border-radius: 50%; border-left-color: var(--accent-gold);
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ---------------- 共用 Header ---------------- */
        header { 
            background: var(--main-dark); height: 180px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 36px; font-weight: bold; letter-spacing: 3px;
        }
        .header-bar {
            background: var(--main-dark); color: white; padding: 15px; 
            display: flex; align-items: center; justify-content: center; position: relative; min-height: 40px;
        }
        .header-title { font-size: 28px; font-weight: bold; margin: 0; padding: 0 130px; text-align: center; width: 100%; box-sizing: border-box; }
        .nav-btn {
            position: absolute; left: 20px; background-color: transparent; color: white;
            border: 2px solid white; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; z-index: 10;
        }
        .nav-btn:hover { background: white; color: var(--main-dark); }

        /* 🌟 新增：懸浮投票狀態列 */
        .vote-status-bar {
            background: var(--accent-gold); color: white; text-align: center; padding: 10px;
            font-size: 16px; font-weight: bold; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* ---------------- 首頁/列表樣式 ---------------- */
        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 40px; max-width: 1000px; margin: 0 auto; }
        .theme-btn {
            background-color: var(--card-bg); color: var(--main-dark); height: 120px; 
            display: flex; align-items: center; justify-content: center; border: 2px solid #e2e8f0;
            font-size: 24px; border-radius: 16px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .theme-btn:hover { border-color: var(--accent-gold); box-shadow: 0 10px 20px rgba(0,0,0,0.05); transform: translateY(-3px); }

        .list-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .item-card {
            background-color: var(--card-bg); border-radius: 16px; padding: 15px;
            text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .item-card:hover { border-color: var(--accent-gold); transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .img-placeholder { background: #f8fafc; width: 100%; aspect-ratio: 1/1; border-radius: 12px; margin-bottom: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center;}
        .img-placeholder img { width: 100%; height: 100%; object-fit: contain; }
        .card-title { font-weight: bold; font-size: 18px; color: var(--main-dark); }
        .card-author { font-size: 14px; color: var(--text-light); margin-top: 4px; }

        /* ---------------- 詳細頁樣式 ---------------- */
        .detail-container { 
            display: flex; width: 90%; max-width: 1100px; gap: 40px; background: white;
            padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin: 30px auto; align-items: stretch; 
        }
        .main-image-box { flex: 1.2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .main-image-box img { max-width: 100%; max-height: 400px; border-radius: 12px; object-fit: contain; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .medal-title { font-size: 30px; font-weight: bold; margin-top: 25px; color: var(--main-dark); }
        
        .content-sidebar { flex: 1; display: flex; flex-direction: column; gap: 20px; justify-content: space-between;}
        .info-card { background-color: #f8fafc; border-left: 6px solid var(--main-dark); padding: 25px; border-radius: 8px; display: flex; flex-direction: column; gap: 20px; flex-grow:1;}
        .info-section h3 { margin: 0; color: var(--main-dark); font-size: 18px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .info-section p { margin: 10px 0 0 0; font-size: 16px; line-height: 1.7; color: var(--text-dark); white-space: pre-line; }
        
        /* 🌟 投票按鈕樣式 */
        .vote-btn {
            background-color: var(--accent-gold); color: white; border: none; padding: 20px; width: 100%;
            border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .vote-btn:hover { background-color: var(--accent-hover); transform: translateY(-2px); }
        .vote-btn:disabled { background-color: #cbd5e1; color: #64748b; cursor: not-allowed; box-shadow: none; transform: none; }

        @media (max-width: 768px) {
            header { height: 120px; font-size: 28px; }
            .header-title { font-size: 20px; padding: 0 90px; }
            .nav-btn { padding: 6px 12px; font-size: 14px; left: 10px; }
            .home-grid { grid-template-columns: 1fr; padding: 20px; }
            .list-grid { grid-template-columns: repeat(2, 1fr); padding: 20px; gap: 15px;}
            .detail-container { flex-direction: column; padding: 20px; }
            .main-image-box img { max-height: 300px; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">載入展館資料中...</div>
    </div>

    <div class="vote-status-bar" id="status-bar">
        您目前的投票紀錄（已用 <span id="vote-count">0</span> / 3 票）
    </div>

    <div id="page-home" class="page active">
        <header>
            人氣票選展區
            <div style="font-size: 16px; font-weight: normal; margin-top: 10px; letter-spacing: 1px;">請投下您神聖的 3 票</div>
        </header>
        <div class="home-grid">
            <div class="theme-btn" onclick="switchToList('物件')">主題：物件</div>
            <div class="theme-btn" onclick="switchToList('配件')">主題：配件</div>
            <div class="theme-btn" onclick="switchToList('技能')">主題：技能</div>
            <div class="theme-btn" onclick="switchToList('特質')">主題：特質</div>
        </div>
    </div>

    <div id="page-list" class="page">
        <div class="header-bar">
            <button class="nav-btn" onclick="switchToHome()">⬅ 回首頁</button>
            <div class="header-title" id="list-title">主題</div>
        </div>
        <div class="list-grid" id="list-container"></div>
    </div>

    <div id="page-detail" class="page">
        <div class="header-bar">
            <button class="nav-btn" onclick="backToPrevious()">⬅ 返回</button>
            <div class="header-title">作品詳情</div>
        </div>
        <div class="detail-container">
            <div class="main-image-box">
                <img id="medal-img" src="" alt="作品圖片">
                <div class="medal-title" id="medal-name">作品名稱</div>
                <div class="card-author" id="medal-author" style="font-size: 18px; margin-top: 5px;"></div>
            </div>
            <div class="content-sidebar">
                <div class="info-card">
                    <div class="info-section">
                        <h3>💡 作品理念</h3>
                        <p id="concept-text">載入中...</p>
                    </div>
                    <div class="info-section">
                        <h3>🎤 採訪內容</h3>
                        <p id="interview-text">載入中...</p>
                    </div>
                </div>
                
                <button class="vote-btn" id="action-vote-btn" onclick="submitVote()">
                    🗳️ 投給這個作品！
                </button>

            </div>
        </div>
    </div>

    <script>
        // 你的資料庫 API
        const DATA_GAS_URL = "https://script.google.com/macros/s/AKfycbzFdiVTqT5QxCJPdCRLDHGn_tKrpIJ82LlmRKLYkrFRxCxSu1n9lnwXA_bOtTOYzRe7Fg/exec"; 
        
        // 🌟 投票專用的 API (請替換成之前教你寫的那個接收 doPost 投票的 GAS 網址)
        const VOTE_GAS_URL = "你的投票後端_GAS_URL"; 

        let exhibitionData = null; 
        let currentCategory = "";  
        let currentArtworkId = ""; // 記錄當前觀看作品 ID (使用學生姓名)

        // 🌟 1. 讀取使用者的投票紀錄 (LocalStorage)
        let votedArtworks = JSON.parse(localStorage.getItem('my_votes')) || [];

        async function initData() {
            updateVoteUI(); // 初始化畫面上方的票數
            
            const cachedData = localStorage.getItem('exhibitionData');
            if (cachedData) {
                try {
                    exhibitionData = JSON.parse(cachedData);
                    if (exhibitionData && exhibitionData.images) {
                        document.getElementById('loader').style.display = 'none';
                        checkQRUrlParam(); // 🌟 資料準備好後，檢查是否有掃描 QR Code
                        return;
                    }
                } catch (e) { console.log("快取失效"); }
            }
            await fetchFromGoogle();
        }

        async function fetchFromGoogle() {
            try {
                const response = await fetch(DATA_GAS_URL);
                exhibitionData = await response.json();
                localStorage.setItem('exhibitionData', JSON.stringify(exhibitionData));
                document.getElementById('loader').style.display = 'none';
                checkQRUrlParam(); // 🌟 資料準備好後，檢查是否有掃描 QR Code
            } catch (e) {
                document.getElementById('loader-text').innerText = "載入失敗，請重新整理！";
            }
        }

        // 🌟 2. 檢查網址是否有 ?id=XXX (處理 QR Code 掃描)
        function checkQRUrlParam() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            
            if (targetId && exhibitionData && exhibitionData.images) {
                // 從資料中找尋這張圖片的網址
                const targetImg = exhibitionData.images.find(img => img.name === targetId);
                if (targetImg) {
                    // 如果找到了，直接切換到詳細頁
                    switchToDetail(targetId, targetImg.url);
                }
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function switchToHome() { 
            // 如果網址上有參數，回首頁時順便清掉，避免重新整理又跳回作品
            window.history.replaceState({}, document.title, window.location.pathname);
            showPage('page-home'); 
        }

        function switchToList(category) {
            currentCategory = category;
            document.getElementById('list-title').innerText = "主題：" + category;
            const container = document.getElementById('list-container');
            
            if (!exhibitionData || !exhibitionData.images) return;
            const filteredImages = exhibitionData.images.filter(img => img.category === category);
            
            let cardHtml = "";
            filteredImages.forEach(item => {
                const textData = exhibitionData.texts ? exhibitionData.texts[item.name] : null;
                const displayTitle = (textData && textData.artName) ? textData.artName : item.name;
                const authorLabel = (textData && textData.artName) ? `作者：${item.name}` : '';
                
                // 🌟 如果該作品已經投過票，在清單上也可以做個小標記 (選項)
                const votedBadge = votedArtworks.includes(item.name) ? `<div style="color:var(--accent-gold); font-weight:bold; margin-top:5px;">✅ 已支持</div>` : '';

                cardHtml += `
                    <div class="item-card" onclick="switchToDetail('${item.name}', '${item.url}')">
                        <div class="img-placeholder"><img src="${item.url}" alt="${displayTitle}"></div>
                        <div class="card-title">${displayTitle}</div>
                        <div class="card-author">${authorLabel}</div>
                        ${votedBadge}
                    </div>
                `;
            });
            container.innerHTML = cardHtml;
            showPage('page-list');
        }

        function switchToDetail(name, imgUrl) {
            currentArtworkId = name;
            
            let detailText = { artName: "", concept: "暫無作品理念資訊。", interview: "暫無採訪內容資訊。" };
            if (exhibitionData && exhibitionData.texts && exhibitionData.texts[name]) {
                detailText = exhibitionData.texts[name];
            }
            
            const displayTitle = detailText.artName ? detailText.artName : name;
            document.getElementById('medal-name').innerText = displayTitle;
            document.getElementById('medal-author').innerText = detailText.artName ? `作者：${name}` : "";
            document.getElementById('medal-img').src = imgUrl;
            document.getElementById('concept-text').innerText = detailText.concept;
            document.getElementById('interview-text').innerText = detailText.interview;
            
            updateVoteUI(); // 切換時檢查這個作品的按鈕狀態
            showPage('page-detail');
        }

        function backToPrevious() { 
            // 如果是透過 QR Code 直達詳細頁，按返回就回首頁；否則回列表
            if(currentCategory === "") switchToHome();
            else switchToList(currentCategory); 
        }

        // 🌟 3. 更新投票介面 (上方數字、按鈕狀態)
        function updateVoteUI() {
            document.getElementById('vote-count').innerText = votedArtworks.length;
            
            const voteBtn = document.getElementById('action-vote-btn');
            
            if (votedArtworks.includes(currentArtworkId)) {
                voteBtn.innerText = "✅ 你已投票支持此作品";
                voteBtn.disabled = true;
            } else if (votedArtworks.length >= 3) {
                voteBtn.innerText = "🔒 3 票已用完囉";
                voteBtn.disabled = true;
            } else {
                voteBtn.innerText = "🗳️ 投給這個作品！";
                voteBtn.disabled = false;
            }
        }

        // 🌟 4. 點擊投票邏輯
        function submitVote() {
            if (votedArtworks.includes(currentArtworkId)) return alert("此作品你已經投過囉！");
            if (votedArtworks.length >= 3) return alert("你已經投滿 3 票囉！");

            // -- 💡 下方這段 fetch 是真的要傳給後台的，目前先註解，你可以接上你的投票後台 API --
            /*
            fetch(VOTE_GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: currentArtworkId })
            }).then(() => {
                // 成功後執行以下...
            }).catch(e => alert("網路錯誤，請稍後再試"));
            */

            // ⚠️ 測試用：直接假裝傳送成功，寫入快取
            votedArtworks.push(currentArtworkId);
            localStorage.setItem('my_votes', JSON.stringify(votedArtworks));
            
            alert("投票成功！感謝您的支持！");
            updateVoteUI(); // 刷新按鈕狀態
        }

        initData();
    </script>
</body>
</html>
