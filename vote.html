<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人氣票選展覽館</title>
    <style>
        :root { 
            /* 藝廊質感配色：深藍灰、高質感金、乾淨白 */
            --primary-bg: #f8fafc; 
            --main-dark: #0f172a; 
            --accent-gold: #eab308; 
            --accent-hover: #ca8a04;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
        }
        body { 
            margin: 0; font-family: "Microsoft JhengHei", sans-serif; 
            background-color: var(--primary-bg); color: var(--text-dark);
            min-height: 100vh;
        }

        .page { display: none; }
        .page.active { display: block; }

        /* ---------------- 載入動畫 ---------------- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; font-size: 24px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3); width: 50px; height: 50px;
            border-radius: 50%; border-left-color: var(--accent-gold);
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ---------------- 共用 Header ---------------- */
        header { 
            background: var(--main-dark); height: 140px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 32px; font-weight: bold; letter-spacing: 3px;
        }
        .header-bar {
            background: var(--main-dark); color: white; padding: 15px; 
            display: flex; align-items: center; justify-content: center; position: relative; min-height: 40px;
        }
        .header-title { font-size: 24px; font-weight: bold; margin: 0; padding: 0 130px; text-align: center; width: 100%; box-sizing: border-box; }
        .nav-btn {
            position: absolute; left: 20px; background-color: transparent; color: white;
            border: 2px solid white; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; z-index: 10;
        }
        .nav-btn:hover { background: white; color: var(--main-dark); }

        /* 懸浮投票狀態列 */
        .vote-status-bar {
            background: var(--accent-gold); color: var(--main-dark); text-align: center; padding: 10px;
            font-size: 16px; font-weight: bold; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* ---------------- 首頁/列表樣式 ---------------- */
        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 40px; max-width: 1000px; margin: 0 auto; }
        .theme-btn {
            background-color: var(--card-bg); color: var(--main-dark); height: 100px; 
            display: flex; align-items: center; justify-content: center; border: 2px solid #e2e8f0;
            font-size: 22px; border-radius: 16px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .theme-btn:hover { border-color: var(--accent-gold); transform: translateY(-3px); }

        .list-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .item-card {
            background-color: var(--card-bg); border-radius: 16px; padding: 15px;
            text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
        }
        .item-card:hover { border-color: var(--accent-gold); transform: translateY(-5px); }
        .img-placeholder { background: #f1f5f9; width: 100%; aspect-ratio: 1/1; border-radius: 12px; margin-bottom: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center;}
        .img-placeholder img { width: 100%; height: 100%; object-fit: contain; }
        .card-title { font-weight: bold; font-size: 18px; color: var(--main-dark); }
        .card-author { font-size: 14px; color: var(--text-light); margin-top: 4px; }

        /* ---------------- 3. 全新詳細頁樣式（左右/上下對比影像） ---------------- */
        .detail-container { 
            max-width: 1100px; margin: 30px auto; padding: 0 20px;
            display: flex; flex-direction: column; gap: 30px;
        }
        /* 標題與作者區塊 */
        .title-block { text-align: center; }
        .medal-title { font-size: 32px; font-weight: bold; margin: 0; color: var(--main-dark); }
        .medal-author { font-size: 18px; color: var(--text-light); margin-top: 8px; }

        /* 雙圖對比區 */
        .image-gallery-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 30px;
        }
        .image-viewer-box {
            background: white; padding: 20px; border-radius: 20px;
            border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            display: flex; flex-direction: column; align-items: center;
        }
        .image-tag {
            background: var(--main-dark); color: white; padding: 6px 16px;
            border-radius: 30px; font-size: 14px; font-weight: bold; margin-bottom: 15px;
        }
        .image-viewer-box img {
            width: 100%; max-height: 450px; object-fit: contain;
            border-radius: 10px;
        }

        /* 投票按鈕控制 */
        .action-block { max-width: 500px; width: 100%; margin: 10px auto 40px auto; }
        .vote-btn {
            background-color: var(--accent-gold); color: var(--main-dark); border: none; padding: 20px; width: 100%;
            border-radius: 16px; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(234, 179, 8, 0.2);
        }
        .vote-btn:hover { background-color: var(--accent-hover); transform: translateY(-2px); }
        .vote-btn:disabled { background-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }

        @media (max-width: 768px) {
            header { height: 100px; font-size: 24px; }
            .header-title { font-size: 18px; padding: 0 90px; }
            .nav-btn { padding: 6px 12px; font-size: 14px; left: 10px; }
            .home-grid { grid-template-columns: 1fr; padding: 20px; }
            .list-grid { grid-template-columns: repeat(2, 1fr); padding: 20px; gap: 15px;}
            
            /* 手機版雙圖改為上下堆疊 */
            .image-gallery-grid { grid-template-columns: 1fr; gap: 20px; }
            .image-viewer-box img { max-height: 350px; }
            .medal-title { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">載入中...</div>
    </div>

    <div class="vote-status-bar" id="status-bar">
        您目前的投票紀錄（已用 <span id="vote-count">0</span> / 3 票）
    </div>

    <div id="page-home" class="page active">
        <header>人氣票選展區</header>
        <div class="home-grid">
            <div class="theme-btn" onclick="switchToList('物件')">主題：物件</div>
            <div class="theme-btn" onclick="switchToList('配件')">主題：配件</div>
            <div class="theme-btn" onclick="switchToList('技能')">主題：技能</div>
            <div class="theme-btn" onclick="switchToList('特質')">主題：特質</div>
        </div>
    </div>

    <div id="page-list" class="page">
        <div class="header-bar">
            <button class="nav-btn" onclick="switchToHome()">🏠 回首頁</button>
            <div class="header-title" id="list-title">主題</div>
        </div>
        <div class="list-grid" id="list-container"></div>
    </div>

    <div id="page-detail" class="page">
        <div class="header-bar">
            <button class="nav-btn" onclick="backToPrevious()">⬅ 返回</button>
            <div class="header-title">作品投票</div>
        </div>
        
        <div class="detail-container">
            <div class="title-block">
                <div class="medal-title" id="medal-name">作品名稱</div>
                <div class="medal-author" id="medal-author">作者：學生姓名</div>
            </div>

            <div class="image-gallery-grid">
                <div class="image-viewer-box">
                    <div class="image-tag">🥇 獎牌實品照</div>
                    <img id="medal-img" src="" alt="獎牌實品照">
                </div>
                <div class="image-viewer-box">
                    <div class="image-tag">📐 作品設計圖</div>
                    <img id="design-img" src="" alt="作品設計圖">
                </div>
            </div>

            <div class="action-block">
                <button class="vote-btn" id="action-vote-btn" onclick="submitVote()">
                    🗳️ 投給這個作品！
                </button>
            </div>
        </div>
    </div>

    <script>
        const DATA_GAS_URL = "https://script.google.com/macros/s/AKfycbwH7GySCb1uYUdm2Z0vmfYeoaksSzA4W1gabfO-w6O0mXl_0EVEBkuCOXoVuF-W7vvO/exec"; 
        const VOTE_GAS_URL = "https://script.google.com/macros/s/AKfycbwH7GySCb1uYUdm2Z0vmfYeoaksSzA4W1gabfO-w6O0mXl_0EVEBkuCOXoVuF-W7vvO/exec"; // 👈 請填入接收投票的 GAS Web App 網址

        let exhibitionData = null; 
        let currentCategory = "";  
        let currentArtworkId = ""; // 核心：使用學生姓名作為唯一的 Key

        // 讀取 LocalStorage 投票紀錄
        let votedArtworks = JSON.parse(localStorage.getItem('my_votes')) || [];

        async function initData() {
            updateVoteUI();
            const cachedData = localStorage.getItem('exhibitionData');
            if (cachedData) {
                try {
                    exhibitionData = JSON.parse(cachedData);
                    if (exhibitionData && exhibitionData.images) {
                        document.getElementById('loader').style.display = 'none';
                        checkQRUrlParam();
                        return;
                    }
                } catch (e) {}
            }
            await fetchFromGoogle();
        }

        async function fetchFromGoogle() {
            try {
                const response = await fetch(DATA_GAS_URL);
                exhibitionData = await response.json();
                localStorage.setItem('exhibitionData', JSON.stringify(exhibitionData));
                document.getElementById('loader').style.display = 'none';
                checkQRUrlParam();
            } catch (e) {
                document.getElementById('loader-text').innerText = "載入失敗，請重新整理！";
            }
        }

        // QR Code 掃描參數檢查 (?id=學生姓名)
        function checkQRUrlParam() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            
            if (targetId && exhibitionData && exhibitionData.images) {
                const targetImg = exhibitionData.images.find(img => img.name === targetId);
                if (targetImg) {
                    switchToDetail(targetId, targetImg.url);
                }
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function switchToHome() { 
            window.history.replaceState({}, document.title, window.location.pathname);
            showPage('page-home'); 
        }

        function switchToList(category) {
            currentCategory = category;
            document.getElementById('list-title').innerText = "主題：" + category;
            const container = document.getElementById('list-container');
            
            if (!exhibitionData || !exhibitionData.images) return;
            const filteredImages = exhibitionData.images.filter(img => img.category === category);
            
            let cardHtml = "";
            filteredImages.forEach(item => {
                const textData = exhibitionData.texts ? exhibitionData.texts[item.name] : null;
                const displayTitle = (textData && textData.artName) ? textData.artName : item.name;
                const authorLabel = (textData && textData.artName) ? `作者：${item.name}` : '';
                const votedBadge = votedArtworks.includes(item.name) ? `<div style="color:var(--accent-gold); font-weight:bold; margin-top:5px;">✅ 已支持</div>` : '';

                cardHtml += `
                    <div class="item-card" onclick="switchToDetail('${item.name}', '${item.url}')">
                        <div class="img-placeholder"><img src="${item.url}" alt="${displayTitle}"></div>
                        <div class="card-title">${displayTitle}</div>
                        <div class="card-author">${authorLabel}</div>
                        ${votedBadge}
                    </div>
                `;
            });
            container.innerHTML = cardHtml;
            showPage('page-list');
        }

        function switchToDetail(name, imgUrl) {
            currentArtworkId = name; // 學生姓名當作唯一識別碼
            
            let detailText = { artName: "", designUrl: "" }; // 🌟 預期後台有提供 designUrl (設計圖網址)
            if (exhibitionData && exhibitionData.texts && exhibitionData.texts[name]) {
                detailText = exhibitionData.texts[name];
            }
            
            // 填入作品資訊
            const displayTitle = detailText.artName ? detailText.artName : name;
            document.getElementById('medal-name').innerText = displayTitle;
            document.getElementById('medal-author').innerText = detailText.artName ? `作者：${name}` : "";
            
            // 填入雙影像網址
            document.getElementById('medal-img').src = imgUrl; // 獎牌實品圖
            
            // 🌟 這裡讀取設計圖網址。
            // 如果你在 GAS 試算表裡的欄位名稱是不同的（例如叫 draftUrls 陣列的第一張），請自行修改下方這行。
            // 範例：如果沿用舊的，可以寫成：detailText.draftUrls ? detailText.draftUrls[0] : '預設圖網址';
            document.getElementById('design-img').src = detailText.designUrl || "https://placehold.co/400x400?text=Design+Coming+Soon"; 
            
            updateVoteUI();
            showPage('page-detail');
        }

        function backToPrevious() { 
            if(currentCategory === "") switchToHome();
            else switchToList(currentCategory); 
        }

        // 更新介面與投票狀態清單
        function updateVoteUI() {
            document.getElementById('vote-count').innerText = votedArtworks.length;
            const voteBtn = document.getElementById('action-vote-btn');
            
            if (votedArtworks.includes(currentArtworkId)) {
                voteBtn.innerText = "✅ 你已投票支持此作品";
                voteBtn.disabled = true;
            } else if (votedArtworks.length >= 3) {
                voteBtn.innerText = "🔒 3 票已用完囉";
                voteBtn.disabled = true;
            } else {
                voteBtn.innerText = "🗳️ 投給這個作品！";
                voteBtn.disabled = false;
            }
        }

        // 點擊投票
        function submitVote() {
            if (votedArtworks.includes(currentArtworkId)) return alert("此作品你已經投過囉！");
            if (votedArtworks.length >= 3) return alert("你已經投滿 3 票囉！");

            // 實聯制傳送給後端 GAS（請記得取消下方註解並對接 API）
            /*
            fetch(VOTE_GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: currentArtworkId })
            }).then(() => { ... }).catch(e => alert("網路錯誤"));
            */

            // 本地快取模擬測試
            votedArtworks.push(currentArtworkId);
            localStorage.setItem('my_votes', JSON.stringify(votedArtworks));
            
            alert("投票成功！感謝您的支持！");
            updateVoteUI();
        }

        initData();
    </script>
</body>
</html>
