<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人氣獎牌票選展覽館</title>
    <style>
        :root { 
            --primary-bg: #f8fafc; 
            --main-dark: #0f172a; 
            --accent-gold: #eab308; 
            --accent-hover: #ca8a04;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
        }
        body { 
            margin: 0; font-family: "Microsoft JhengHei", sans-serif; 
            background-color: var(--primary-bg); color: var(--text-dark);
            min-height: 100vh;
        }
        .page { display: none; }
        .page.active { display: block; }

        /* 載入動畫 */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; font-size: 24px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3); width: 50px; height: 50px;
            border-radius: 50%; border-left-color: var(--accent-gold);
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 頂部狀態列 */
        .vote-status-bar {
            background: var(--accent-gold); color: var(--main-dark); text-align: center; padding: 10px;
            font-size: 16px; font-weight: bold; position: sticky; top: 0; z-index: 100;
        }

        /* 導覽列 */
        header { 
            background: var(--main-dark); height: 140px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 32px; font-weight: bold; letter-spacing: 3px;
        }
        .header-bar {
            background: var(--main-dark); color: white; padding: 15px; 
            display: flex; align-items: center; justify-content: center; position: relative; min-height: 40px;
        }
        .header-title { font-size: 24px; font-weight: bold; margin: 0; text-align: center; width: 100%; }
        .nav-btn {
            position: absolute; left: 20px; background-color: transparent; color: white;
            border: 2px solid white; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        /* 1. 首頁四大主題大鈕 */
        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 40px; max-width: 1000px; margin: 0 auto; }
        .theme-btn {
            background-color: var(--card-bg); color: var(--main-dark); height: 120px; 
            display: flex; align-items: center; justify-content: center; border: 2px solid #e2e8f0;
            font-size: 24px; border-radius: 16px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .theme-btn:hover { border-color: var(--accent-gold); transform: translateY(-3px); }

        /* 2. 學生列表頁 */
        .list-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .item-card {
            background-color: var(--card-bg); border-radius: 16px; padding: 15px;
            text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid #e2e8f0;
        }
        .item-card:hover { border-color: var(--accent-gold); transform: translateY(-5px); }
        .img-placeholder { background: #f1f5f9; width: 100%; aspect-ratio: 1/1; border-radius: 12px; margin-bottom: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center;}
        .img-placeholder img { width: 100%; height: 100%; object-fit: contain; }
        .card-title { font-weight: bold; font-size: 20px; color: var(--main-dark); }

        /* 3. 單一作品詳細頁 (純獎牌大圖) */
        .detail-container { max-width: 550px; margin: 30px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 25px; }
        .medal-title { font-size: 32px; font-weight: bold; text-align: center; margin: 0; color: var(--main-dark); }
        .image-viewer-box {
            background: white; padding: 20px; border-radius: 20px; border: 1px solid #e2e8f0;
            display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }
        .image-viewer-box img { width: 100%; max-height: 500px; object-fit: contain; border-radius: 10px; }
        
        /* 投票按鈕 */
        .vote-btn {
            background-color: var(--accent-gold); color: var(--main-dark); border: none; padding: 20px; width: 100%;
            border-radius: 16px; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(234, 179, 8, 0.2);
        }
        .vote-btn:hover { background-color: var(--accent-hover); }
        .vote-btn:disabled { background-color: #cbd5e1; color: #94a3b8; cursor: not-allowed; box-shadow: none; }

        @media (max-width: 768px) {
            header { height: 100px; font-size: 24px; }
            .home-grid { grid-template-columns: 1fr; padding: 20px; }
            .list-grid { grid-template-columns: repeat(2, 1fr); padding: 20px; gap: 15px;}
            .medal-title { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">正在讀取展區資料...</div>
    </div>

    <div class="vote-status-bar">
        您目前的投票紀錄（已用 <span id="vote-count">0</span> / 3 票）
    </div>

    <div id="page-home" class="page active">
        <header>人氣獎牌票選展區</header>
        <div class="home-grid">
            <div class="theme-btn" onclick="switchToList('物件')">✨ 主題：物件</div>
            <div class="theme-btn" onclick="switchToList('配件')">💎 主題：配件</div>
            <div class="theme-btn" onclick="switchToList('技能')">⚡ 主題：技能</div>
            <div class="theme-btn" onclick="switchToList('特質')">🔥 主題：特質</div>
        </div>
    </div>

    <div id="page-list" class="page">
        <div class="header-bar">
            <button class="nav-btn" onclick="switchToHome()">🏠 回首頁</button>
            <div class="header-title" id="list-title">主題</div>
        </div>
        <div class="list-grid" id="list-container"></div>
    </div>

    <div id="page-detail" class="page">
        <div class="header-bar">
            <button class="nav-btn" onclick="backToPrevious()">⬅ 返回</button>
            <div class="header-title">作品投票</div>
        </div>
        
        <div class="detail-container">
            <div class="medal-title" id="medal-author">學生姓名</div>
            <div class="image-viewer-box">
                <img id="medal-img" src="" alt="獎牌照片">
            </div>
            <button class="vote-btn" id="action-vote-btn" onclick="submitVote()">
                🗳️ 投給這個作品！
            </button>
        </div>
    </div>

    <script>
        // 🌟 請把這裡改成你最新部署得到的 GAS 網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwH7GySCb1uYUdm2Z0vmfYeoaksSzA4W1gabfO-w6O0mXl_0EVEBkuCOXoVuF-W7vvO/exec"; 

        let exhibitionData = null; 
        let currentCategory = "";
        let currentStudent = "";  
        let votedArtworks = JSON.parse(localStorage.getItem('my_votes')) || [];

        async function initData() {
            updateVoteUI();
            // 讀取快取以利展場快速開網頁
            const cachedData = localStorage.getItem('exhibitionData_v3');
            if (cachedData) {
                try {
                    exhibitionData = JSON.parse(cachedData);
                    if (exhibitionData && exhibitionData.images) {
                        document.getElementById('loader').style.display = 'none';
                        checkQRUrlParam();
                        return;
                    }
                } catch (e) {}
            }
            await fetchFromGoogle();
        }

        async function fetchFromGoogle() {
            try {
                const response = await fetch(GAS_URL);
                exhibitionData = await response.json();
                localStorage.setItem('exhibitionData_v3', JSON.stringify(exhibitionData));
                document.getElementById('loader').style.display = 'none';
                checkQRUrlParam();
            } catch (e) {
                document.getElementById('loader-text').innerText = "載入失敗，請重整網頁！";
            }
        }

        function switchToHome() { 
            window.history.replaceState({}, document.title, window.location.pathname);
            showPage('page-home'); 
        }

        function switchToList(category) {
            currentCategory = category;
            document.getElementById('list-title').innerText = "主題：" + category;
            const container = document.getElementById('list-container');
            
            if (!exhibitionData || !exhibitionData.images) return;
            // 根據點選的主題篩選學生
            const filteredImages = exhibitionData.images.filter(img => img.category === category);
            
            let cardHtml = "";
            filteredImages.forEach(item => {
                const votedBadge = votedArtworks.includes(item.name) ? `<div style="color:var(--accent-gold); font-weight:bold; margin-top:5px;">✅ 已支持</div>` : '';
                cardHtml += `
                    <div class="item-card" onclick="switchToDetail('${item.name}', '${item.url}')">
                        <div class="img-placeholder"><img src="${item.url}" alt="${item.name}"></div>
                        <div class="card-title">${item.name}</div>
                        ${votedBadge}
                    </div>
                `;
            });
            container.innerHTML = cardHtml;
            showPage('page-list');
        }

        function switchToDetail(name, imgUrl) {
            currentStudent = name;
            document.getElementById('medal-author').innerText = name + " 的作品";
            document.getElementById('medal-img').src = imgUrl; 
            updateVoteUI();
            showPage('page-detail');
        }

        function backToPrevious() { 
            if(currentCategory === "") switchToHome(); // 如果是掃 QR Code 進來的，返回就直接回首頁
            else switchToList(currentCategory); 
        }

        // 檢查 QR Code 參數 (?id=學生姓名)
        function checkQRUrlParam() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            if (targetId && exhibitionData && exhibitionData.images) {
                const targetImg = exhibitionData.images.find(img => img.name === targetId);
                if (targetImg) {
                    // 順便幫他設定好分類，這樣點返回時才能回到該主題列表
                    currentCategory = targetImg.category; 
                    switchToDetail(targetId, targetImg.url);
                }
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function updateVoteUI() {
            document.getElementById('vote-count').innerText = votedArtworks.length;
            const voteBtn = document.getElementById('action-vote-btn');
            
            if (votedArtworks.includes(currentStudent)) {
                voteBtn.innerText = "✅ 你已投票支持此作品";
                voteBtn.disabled = true;
            } else if (votedArtworks.length >= 3) {
                voteBtn.innerText = "🔒 3 票已用完囉";
                voteBtn.disabled = true;
            } else {
                voteBtn.innerText = "🗳️ 投給這個作品！";
                voteBtn.disabled = false;
            }
        }

        function submitVote() {
            if (votedArtworks.includes(currentStudent)) return alert("這張票你已經投過囉！");
            if (votedArtworks.length >= 3) return alert("你已經投滿 3 票囉！");

            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: currentStudent })
            }).then(() => {
                votedArtworks.push(currentStudent);
                localStorage.setItem('my_votes', JSON.stringify(votedArtworks));
                alert("投票成功！感謝您的支持！");
                updateVoteUI();
            }).catch(e => alert("網路錯誤，請稍後再試"));
        }

        initData();
    </script>
</body>
</html>
