<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位展覽館</title>
    <style>
        :root { 
            --maroon: #8b203c; 
            --pink: #d68197; 
            --light-pink: #fdf5f7;
        }
        body { 
            margin: 0; 
            font-family: "Microsoft JhengHei", sans-serif; 
            background-color: #f5f5f5; 
            min-height: 100vh;
        }

        /* ---------------- 頁面切換控制 ---------------- */
        .page { display: none; }
        .page.active { display: block; }

        /* ---------------- 載入動畫 (Spinner) ---------------- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(139, 32, 60, 0.95); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; font-size: 24px; transition: opacity 0.5s;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3); width: 50px; height: 50px;
            border-radius: 50%; border-left-color: white;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ---------------- 1. 首頁樣式 ---------------- */
        header { 
            background: var(--maroon); 
            background-image: url("header.png")
            height: 200px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 40px; font-weight: bold; letter-spacing: 5px;
        }
        .home-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 30px; 
            padding: 50px; max-width: 1000px; margin: 20px auto;
        }
        .theme-btn {
            background-color: var(--pink); color: white; height: 150px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; border-radius: 25px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-weight: bold;
        }
        .theme-btn:hover { transform: scale(1.05); background-color: #c46d84; }

        .reload-cache-btn {
            display: block; margin: 20px auto; background: #666; color: white;
            border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer;
            font-size: 15px; font-weight: bold; transition: 0.3s;
        }
        .reload-cache-btn:hover { background: #555; }

        /* ---------------- 2. 列表頁樣式 ---------------- */
        .header-bar {
            background: var(--maroon); color: white; padding: 20px; 
            display: flex; align-items: center; justify-content: center; position: relative; min-height: 40px;
        }
        .header-title { 
            font-size: 32px; 
            font-weight: bold; 
            margin: 0; 
            padding: 0 130px; 
            text-align: center;
            box-sizing: border-box;
            width: 100%;
        }
        .nav-btn {
            position: absolute; left: 20px; background-color: var(--pink); color: white;
            border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer;
            z-index: 10; 
        }
        .list-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto;
        }
        .item-card {
            background-color: var(--pink); border-radius: 20px; padding: 15px;
            text-align: center; color: white; cursor: pointer; transition: 0.3s; text-decoration: none;
            position: relative;
        }
        .item-card:hover { background-color: #c46d84; transform: translateY(-5px); }
        .img-placeholder {
            background: #fff; width: 100%; aspect-ratio: 1/1; border-radius: 15px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .img-placeholder img { width: 100%; height: 100%; object-fit: contain; }

        .audio-badge {
            display: inline-block;
            background-color: var(--maroon);
            color: white;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 6px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* ---------------- 3. 詳細頁樣式 ---------------- */
        .detail-container { 
            display: flex; width: 90%; max-width: 1100px; gap: 40px; background: white;
            padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin: 40px auto; align-items: stretch; 
        }
        .main-image-box {
            flex: 1.2; background-color: var(--pink); border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; min-height: 450px; padding: 20px; box-sizing: border-box; text-align: center;
        }
        .main-image-box img { max-width: 100%; max-height: 350px; border-radius: 15px; object-fit: contain; }
        .medal-title { font-size: 28px; font-weight: bold; margin-top: 20px; }
        .content-sidebar { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .info-card {
            background-color: var(--light-pink); border-left: 5px solid var(--maroon);
            padding: 20px; border-radius: 0 15px 15px 0; flex-grow: 1; display: flex; flex-direction: column; gap: 15px;
        }
        .info-section { margin-bottom: 5px; }
        .info-section h3 { margin: 0; color: var(--maroon); font-size: 18px; border-bottom: 1px dashed var(--pink); padding-bottom: 5px; }
        .info-section p { margin: 5px 0 0 0; color: #444; font-size: 15px; line-height: 1.6; white-space: pre-line; }
        
        /* 💡 【外觀全新優化版 iframe 容器】 */
        .iframe-audio-wrapper {
            width: 100%;
            height: 70px;          /* 給予充足的高度，防止 Google 介面擠壓跑版 */
            border-radius: 12px;   /* 漂亮圓角 */
            overflow: hidden;      /* 完美隱藏外溢的黑色大色塊 */
            border: 2px solid var(--pink); /* 用你的粉紅色包住它，提升整體感 */
            background-color: #000;
            margin-top: 10px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .iframe-audio-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .action-btn {
            background-color: var(--maroon); color: white; border: none; padding: 15px; 
            border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center;
        }
        .action-btn:hover { background-color: #b03554; }
        .action-btn.active { background-color: var(--pink); }
        
        .action-btn:disabled {
            background-color: #ccc !important;
            color: #888 !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            transform: none !important;
        }
        .back-btn { background: #666; }

        @media (max-width: 768px) {
            .header-title { 
                font-size: 20px !important; 
                padding: 0 90px !important; 
            }
            .nav-btn { 
                padding: 8px 12px !important; 
                font-size: 14px !important; 
                left: 10px !important; 
            }
            
            .home-grid { grid-template-columns: 1fr; padding: 20px; }
            .list-grid { grid-template-columns: repeat(2, 1fr); padding: 20px; }
            .detail-container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div id="loader" style="display: none;">
        <div class="spinner"></div>
        <div id="loader-text">首次進入，正在從雲端載入展館資料...</div>
    </div>

    <div id="page-home" class="page active">
        <header>數 位 展 覽 館</header>
        <div class="home-grid">
            <div class="theme-btn" onclick="switchToList('物件')">主題：物件</div>
            <div class="theme-btn" onclick="switchToList('配件')">主題：配件</div>
            <div class="theme-btn" onclick="switchToList('技能')">主題：技能</div>
            <div class="theme-btn" onclick="switchToList('特質')">主題：特質</div>
        </div>
        <button class="reload-cache-btn" onclick="forceReloadData()">🔄 強制同步雲端最新資料</button>
    </div>

    <div id="page-list" class="page">
        <div class="header-bar">
            <button class="nav-btn" onclick="switchToHome()">🏠 回首頁</button>
            <div class="header-title" id="list-title">主題</div>
        </div>
        <div class="list-grid" id="list-container"></div>
    </div>

    <div id="page-detail" class="page">
        <div class="header-bar">
            <button class="nav-btn" onclick="backToList()">⬅ 回列表</button>
            <div class="header-title">作品詳情</div>
        </div>
        <div class="detail-container">
            <div class="main-image-box">
                <img id="medal-img" src="" alt="獎牌圖片">
                <div class="medal-title" id="medal-name">作品名稱</div>
            </div>
            <div class="content-sidebar">
                <div class="info-card">
                    <div class="info-section">
                        <h3>💡 作品理念</h3>
                        <p id="concept-text">載入中...</p>
                    </div>
                    <div class="info-section">
                        <h3>🎤 採訪內容</h3>
                        <p id="interview-text">載入中...</p>
                    </div>
                    <div class="info-section" id="audio-section" style="display: none;">
                        <h3>🎵 作品導覽音檔</h3>
                        <div class="iframe-audio-wrapper">
                            <iframe id="audio-iframe" src="" scrolling="no"></iframe>
                        </div>
                    </div>
                </div>
                <div class="button-group">
                    <button class="action-btn" id="draft-btn" onclick="toggleDraft()">切換草稿設計</button>
                    <button class="action-btn back-btn" onclick="backToList()">回列表頁</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzFdiVTqT5QxCJPdCRLDHGn_tKrpIJ82LlmRKLYkrFRxCxSu1n9lnwXA_bOtTOYzRe7Fg/exec"; 

        let exhibitionData = null; 
        let currentCategory = "";  
        let currentMedal = null;   
        let currentDraftIndex = -1; 

        async function initData() {
            const cachedData = localStorage.getItem('exhibitionData');
            if (cachedData) {
                try {
                    exhibitionData = JSON.parse(cachedData);
                    if (exhibitionData && exhibitionData.images) {
                        console.log("⚡ 成功讀取本地快取資料！");
                        return;
                    }
                } catch (e) {
                    console.log("快取解析失敗，重新下載中...");
                }
            }
            await fetchFromGoogle();
        }

        async function fetchFromGoogle() {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            document.getElementById('loader-text').innerText = "首次進入，正在從雲端載入展館資料...";

            try {
                const response = await fetch(GAS_URL);
                exhibitionData = await response.json();
                localStorage.setItem('exhibitionData', JSON.stringify(exhibitionData));
                console.log("☁ 已從 Google 雲端同步並存入快取！");
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            } catch (e) {
                document.getElementById('loader-text').innerText = "載入失敗，請確認網路與權限！";
                console.error(e);
            }
        }

        function forceReloadData() {
            localStorage.removeItem('exhibitionData');
            fetchFromGoogle();
        }

        // 🌟 離開時清空網址，強制停音
        function stopAudio() {
            const iframe = document.getElementById('audio-iframe');
            if (iframe) {
                iframe.src = "";
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function switchToHome() { 
            stopAudio(); 
            showPage('page-home'); 
        }

        function switchToList(category) {
            currentCategory = category;
            document.getElementById('list-title').innerText = "主題：" + category;
            const container = document.getElementById('list-container');
            container.innerHTML = "";
        
            if (!exhibitionData || !exhibitionData.images) {
                container.innerHTML = "<div style='grid-column:1/-1; text-align:center;'>資料尚未就緒。</div>";
                showPage('page-list');
                return;
            }
        
            const filteredImages = exhibitionData.images.filter(img => img.category === category);
        
            if (filteredImages.length === 0) {
                container.innerHTML = "<div style='grid-column:1/-1; text-align:center;'>此分類目前沒有照片喔！</div>";
            } else {
                let cardHtml = "";
                
                filteredImages.forEach(item => {
                    const textData = exhibitionData.texts ? exhibitionData.texts[item.name] : null;
                    const displayTitle = (textData && textData.artName) ? textData.artName : item.name;
                    
                    const authorLabel = (textData && textData.artName) ? 
                        `<div style="font-size: 14px; color: #fff; opacity: 0.9; margin-top: 4px;">作者：${item.name}</div>` : '';
                    
                    let audioBadgeHtml = "";
                    if (textData && textData.audioUrl && textData.audioUrl.trim() !== "") {
                        audioBadgeHtml = `<div class="audio-badge">🎵 </div>`;
                    }
        
                    cardHtml += `
                        <div class="item-card" onclick="switchToDetail('${item.name}', '${item.url}')">
                            <div class="img-placeholder"><img src="${item.url}" alt="${displayTitle}"></div>
                            <div style="font-weight: bold; font-size: 18px;">${displayTitle}</div>
                            ${authorLabel}
                            ${audioBadgeHtml}
                        </div>
                    `;
                });
                
                container.innerHTML = cardHtml;
            }
            showPage('page-list');
        }

        // 🌟 100% 絕對成功播放核心
        function switchToDetail(name, imgUrl) {
            stopAudio();

            currentMedal = { name: name, url: imgUrl, draftUrls: [] };
            currentDraftIndex = -1; 
        
            const draftBtn = document.getElementById('draft-btn');
            let detailText = { artName: "", concept: "暫無作品理念資訊。", interview: "暫無採訪內容資訊。", draftUrls: [], audioUrl: "" };
        
            if (exhibitionData && exhibitionData.texts && exhibitionData.texts[name]) {
                detailText = exhibitionData.texts[name];
            }
        
            const displayTitle = detailText.artName ? detailText.artName : name;
            document.getElementById('medal-name').innerText = displayTitle;
            document.getElementById('medal-img').src = imgUrl;
            document.getElementById('concept-text').innerText = detailText.concept;
            document.getElementById('interview-text').innerText = detailText.interview;
            
            const audioSection = document.getElementById('audio-section');
            const audioIframe = document.getElementById('audio-iframe');

            if (detailText.audioUrl && detailText.audioUrl.trim() !== "") {
                try {
                    let fileId = "";
                    if (detailText.audioUrl.includes('id=')) {
                        const urlParams = new URLSearchParams(detailText.audioUrl.split('?')[1]);
                        fileId = urlParams.get('id');
                    } else {
                        const match = detailText.audioUrl.match(/\/d\/([^/]+)/);
                        fileId = match ? match[1] : detailText.audioUrl;
                    }
                    
                    // 💡 直接載入官方預覽端點，因為有了全新的 CSS 封裝，MP4 也絕不會爆開跑版
                    audioIframe.src = "https://drive.google.com/file/d/" + fileId + "/preview";
                    audioSection.style.display = 'block'; 

                } catch(err) {
                    console.error("音檔載入失敗: ", err);
                    audioSection.style.display = 'none';
                }
            } else {
                audioSection.style.display = 'none';  
            }
        
            currentMedal.draftUrls = detailText.draftUrls || [];
        
            if (currentMedal.draftUrls.length === 0) {
                draftBtn.innerText = "暫無草稿設計";
                draftBtn.disabled = true; 
                draftBtn.classList.remove('active');
            } else {
                draftBtn.disabled = false; 
                draftBtn.innerText = `觀看草稿 (共 ${currentMedal.draftUrls.length} 張)`;
                draftBtn.classList.remove('active');
            }
        
            showPage('page-detail');
        }

        function backToList() { 
            stopAudio(); 
            switchToList(currentCategory); 
        }

        function toggleDraft() {
            if (!currentMedal || !currentMedal.draftUrls || currentMedal.draftUrls.length === 0) return;

            const imgElement = document.getElementById('medal-img');
            const draftBtn = document.getElementById('draft-btn');

            currentDraftIndex++; 

            if (currentDraftIndex >= currentMedal.draftUrls.length) {
                currentDraftIndex = -1;
            }

            if (currentDraftIndex === -1) {
                imgElement.src = currentMedal.url;
                draftBtn.innerText = `觀看草稿 (共 ${currentMedal.draftUrls.length} 張)`;
                draftBtn.classList.remove('active');
            } else {
                imgElement.src = currentMedal.draftUrls[currentDraftIndex];
                draftBtn.classList.add('active');
                
                if (currentDraftIndex === currentMedal.draftUrls.length - 1) {
                    draftBtn.innerText = "返回成品設計 ↩";
                } else {
                    draftBtn.innerText = `看下一張草稿 (${currentDraftIndex + 1}/${currentMedal.draftUrls.length})`;
                }
            }
        }

        initData();
    </script>
</body>
</html>
